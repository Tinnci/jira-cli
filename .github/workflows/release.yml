name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "^1.26.5"
      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v0.1.0" }
          $exe = "release-assets/jira-$tag-windows-amd64.exe"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o $exe ./cmd/jira
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($exe))" | Set-Content -Path release-assets/SHA256SUMS.txt -Encoding utf8
          $ver = $tag.TrimStart("v")
          $relTag = "jira-cli-$tag"
          $pub = "${{ vars.PUBLIC_RELEASE_REPO || 'Tinnci/tinnci-releases' }}"
          $manifest = [ordered]@{
            version = $ver
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/$pub/releases/download/$relTag/$([System.IO.Path]::GetFileName($exe))"
                sha256 = $hash
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 4
          $json | Set-Content -Path release-assets/latest.json -Encoding utf8
          $json | Set-Content -Path release-assets/jira-cli-latest.json -Encoding utf8
      - name: Publish binary-only redistributable
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASES_PUBLISH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUBLISH_TOKEN }}
          RELEASES_PUBLISH_TOKEN: ${{ secrets.RELEASES_PUBLISH_TOKEN }}
          PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO || 'Tinnci/tinnci-releases' }}
        shell: pwsh
        run: |
          $tag = "jira-cli-${{ github.ref_name }}"
          gh release view $tag --repo $env:PUBLIC_RELEASE_REPO 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release-assets/* --repo $env:PUBLIC_RELEASE_REPO --clobber
          } else {
            gh release create $tag release-assets/* --repo $env:PUBLIC_RELEASE_REPO --title "jira-cli ${{ github.ref_name }}" --notes "Binary-only redistributable for jira-cli ${{ github.ref_name }}."
          }
          if (Test-Path release-assets/jira-cli-latest.json) {
            gh release view jira-cli-latest --repo $env:PUBLIC_RELEASE_REPO 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload jira-cli-latest release-assets/jira-cli-latest.json --repo $env:PUBLIC_RELEASE_REPO --clobber
            } else {
              gh release create jira-cli-latest release-assets/jira-cli-latest.json --repo $env:PUBLIC_RELEASE_REPO --title "jira-cli Latest Feed" --notes "Rolling latest update manifest for jira-cli."
            }
          }
